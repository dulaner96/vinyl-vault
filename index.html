<!-- HTML: Add this import card anywhere in your layout -->
<div style="background:#1e293b; padding:15px; border-radius:10px; margin:15px 0; color:white;">
  <label style="display:block; font-weight:bold; margin-bottom:8px;">Bulk Import Records</label>
  <input type="file" id="mobileFileInput" accept=".csv" style="color:#cbd5e1;" />
</div>

<!-- JS: Place this before your closing </body> tag -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
document.getElementById('mobileFileInput')?.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const current = JSON.parse(localStorage.getItem('vinylCollection') || '[]');
      const updated = [...current, ...results.data];
      localStorage.setItem('vinylCollection', JSON.stringify(updated));
      alert('Successfully imported ' + results.data.length + ' records!');
      location.reload();
    }
  });
});
</script>
