<!-- Spreadsheet Paste Import Tool -->
<div style="background:#1e293b; padding:15px; border-radius:10px; margin:15px 0; color:white;">
  <label style="display:block; font-weight:bold; margin-bottom:6px;">Paste Spreadsheet Rows</label>
  <p style="font-size:12px; color:#94a3b8; margin-bottom:8px;">Copy rows directly from Excel or Google Sheets and paste them below:</p>
  <textarea id="spreadsheetPasteBox" rows="4" placeholder="Artist	Title	Catalog Number..." style="width:100%; background:#0f172a; color:white; border:1px solid #475569; border-radius:5px; padding:8px; font-size:14px;"></textarea>
  <button id="processPasteBtn" style="margin-top:8px; background:#4f46e5; color:white; border:none; padding:10px 16px; border-radius:5px; font-weight:bold; width:100%; cursor:pointer;">Import Pasted Records</button>
</div>

<script>
document.getElementById('processPasteBtn')?.addEventListener('click', function() {
  const text = document.getElementById('spreadsheetPasteBox').value.trim();
  if (!text) {
    alert('Please paste spreadsheet rows into the box first.');
    return;
  }

  const lines = text.split('\n');
  const newRecords = [];
  let startIndex = 0;

  // Check if the first line is a header row
  const firstCols = lines[0].split(/\t|,/);
  if (firstCols[0].toLowerCase().includes('artist') || firstCols[1]?.toLowerCase().includes('title')) {
    startIndex = 1; // Skip header row
  }

  for (let i = startIndex; i < lines.length; i++) {
    const cols = lines[i].split(/\t|,/).map(c => c.trim());
    if (cols.length < 2) continue; // Skip blank or invalid lines

    newRecords.push({
      artist: cols[0] || '',
      title: cols[1] || '',
      catNum: cols[2] || '',
      media: cols[3] || '',
      sleeve: cols[4] || '',
      speed: cols[5] || '33 RPM'
    });
  }

  if (newRecords.length === 0) {
    alert('No valid records found. Make sure columns are separated by tabs or commas.');
    return;
  }

  const current = JSON.parse(localStorage.getItem('vinylCollection') || '[]');
  const updated = [...current, ...newRecords];
  localStorage.setItem('vinylCollection', JSON.stringify(updated));
  
  alert('Successfully imported ' + newRecords.length + ' records!');
  location.reload();
});
</script>
